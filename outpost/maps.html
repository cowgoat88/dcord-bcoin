<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OUTPOST map styles</title>
<style>
  /* A tool page, not part of the game: pick a generator style, flip through
     seeds, and see the board the way the game would draw it, on a phone
     portrait or a desktop landscape screen, flat or in 3D. */
  :root { --bg:#070d1c; --panel:#0e1830; --line:#27406e; --ink:#e6eeff; --dim:#8da3cc; --on:#2d6cdf; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom); gap:6px; }
  .bar { flex:none; display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding-top:6px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  button { font:inherit; color:var(--ink); background:var(--panel); border:0; padding:8px 10px; min-height:38px;
    cursor:pointer; touch-action:manipulation; }
  .seg button + button { border-left:1px solid var(--line); }
  button[aria-pressed="true"] { background:var(--on); }
  .seed { display:flex; align-items:center; gap:6px; }
  .seed .n { min-width:3.2em; text-align:center; font-variant-numeric:tabular-nums; font-weight:600; }
  .seed button { border:1px solid var(--line); border-radius:9px; }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  canvas { background:#050a16; border:1px solid var(--line); border-radius:8px; display:block; touch-action:manipulation; }
  .info { flex:none; color:var(--dim); font-size:12.5px; padding-bottom:6px; display:flex; flex-wrap:wrap; gap:4px 14px; align-items:center; }
  .info b { color:var(--ink); font-weight:600; }
  .info a { color:#7db4ff; }
  /* Reserve the phone's three-line height up front: the text is filled in after the canvas is fitted. */
  @media (max-width:700px) { .info { min-height:66px; align-content:flex-start; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="seg" id="styleSeg" role="group" aria-label="Style">
      <button data-v="classic">Classic</button>
      <button data-v="spaced">Spaced</button>
      <button data-v="orbital">Orbital</button>
      <button data-v="sectors">Sectors</button>
    </div>
    <div class="seed">
      <button id="prev" aria-label="Previous seed">&#9664;</button>
      <span class="n" id="seedN">1</span>
      <button id="next" aria-label="Next seed">&#9654;</button>
      <button id="rand">Random</button>
    </div>
    <div class="seg" id="viewSeg" role="group" aria-label="View">
      <button data-v="2d">2D</button>
      <button data-v="3d">3D</button>
    </div>
    <div class="seg" id="shapeSeg" role="group" aria-label="Screen">
      <button data-v="phone">Phone</button>
      <button data-v="desktop">Desktop</button>
    </div>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="info" id="info"></div>

<script src="engine.js"></script>
<script src="holo.js"></script>
<script>
(function () {
  "use strict";
  const E = window.OutpostEngine, H = window.OutpostHolo;
  const SCREENS = { phone: [390, 844], desktop: [1280, 800] };
  const AREA = E.MAP_W * E.MAP_H;
  const st = { style: "classic", seed: 1, view: "2d", shape: "phone" };

  // State lives in the hash so a particular board can be sent to someone.
  try {
    const q = new URLSearchParams(location.hash.slice(1));
    if (E.LAYOUTS.indexOf(q.get("style")) !== -1) st.style = q.get("style");
    if (+q.get("seed") > 0) st.seed = +q.get("seed") | 0;
    if (q.get("view") === "3d") st.view = "3d";
    if (q.get("shape") === "desktop") st.shape = "desktop";
  } catch (e) { /* no hash support: defaults */ }

  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const stage = document.getElementById("stage");
  let holo = null, game = null, flip = false;

  function saveHash() {
    try { history.replaceState(null, "", "#style=" + st.style + "&seed=" + st.seed + "&view=" + st.view + "&shape=" + st.shape); }
    catch (e) { /* file:// in some browsers */ }
  }

  function build() {
    const [sw, sh] = SCREENS[st.shape], asp = sw / sh;
    game = E.createGame({ seed: st.seed, mapW: Math.sqrt(AREA * asp), mapH: Math.sqrt(AREA / asp), layout: st.style });
    flip = game.mapH > game.mapW;        // the game draws your base on the near side
  }

  // Canvas CSS size: the chosen screen's aspect, as large as the stage allows.
  function fit() {
    const [sw, sh] = SCREENS[st.shape];
    const aw = stage.clientWidth, ah = stage.clientHeight;
    const s = Math.min(aw / sw, ah / sh);
    const w = Math.max(120, Math.floor(sw * s)), h = Math.max(120, Math.floor(sh * s));
    cv.style.width = w + "px"; cv.style.height = h + "px";
    return [w, h];
  }

  const COL = { command: "#f2c94c", factory: "#ff9440", mine: "#43c0f0", relay: "#52e39a", doomstar: "#c577f0" };
  const OWN = { 1: "#4aa8ff", 2: "#ff6a5e" };
  function shapePath(c, shape, x, y, r) {
    c.beginPath();
    const poly = (n, rot) => { for (let i = 0; i < n; i++) { const a = rot + i * 2 * Math.PI / n; i ? c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : c.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } c.closePath(); };
    if (shape === "hex") poly(6, 0);
    else if (shape === "square") poly(4, Math.PI / 4);
    else if (shape === "diamond") poly(4, 0);
    else if (shape === "star") { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.5 : r; i ? c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : c.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.closePath(); }
    else c.arc(x, y, r, 0, Math.PI * 2);
  }

  function draw2d(w, h) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#050a16"; ctx.fillRect(0, 0, w, h);
    const W = game.mapW, H = game.mapH, pad = 30;       // same fit as the game's flat view
    const s = Math.min((w - pad * 2) / W, (h - pad * 2) / H);
    const ox = (w - W * s) / 2, oy = (h - H * s) / 2;
    const P = (n) => flip ? { x: ox + (W - n.x) * s, y: oy + (H - n.y) * s } : { x: ox + n.x * s, y: oy + n.y * s };
    const C = flip ? (x, y) => ({ x: ox + (W - x) * s, y: oy + (H - y) * s }) : (x, y) => ({ x: ox + x * s, y: oy + y * s });
    // Range rings, as the 3D floor draws them (ellipses for an orbital map).
    ctx.strokeStyle = "rgba(111,154,214,0.28)"; ctx.lineWidth = 1;
    const rings = game.rings || [0.28, 0.58, 0.88].map((f) => { const r = Math.min(W, H) * f * 0.5 * 1.15; return [r, r]; });
    for (const [rx, ry] of rings) {
      const c = C(W / 2, H / 2);
      ctx.beginPath(); ctx.ellipse(c.x, c.y, rx * s, ry * s, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.lineCap = "round";
    for (const l of game.lanes) {
      const a = P(game.nodes[l.a]), b = P(game.nodes[l.b]);
      ctx.strokeStyle = "rgba(125,155,200,0.75)"; ctx.lineWidth = Math.max(2, 3.2 * s * 1.5);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    for (const n of game.nodes) {
      const p = P(n), t = E.NODE_TYPES[n.type], r = t.radius * s;
      shapePath(ctx, t.shape, p.x, p.y, r);
      ctx.fillStyle = "#0a1226"; ctx.fill();
      ctx.lineWidth = 2.6; ctx.strokeStyle = n.owner ? OWN[n.owner] : COL[n.type]; ctx.stroke();
      if (n.owner) { ctx.fillStyle = COL[n.type]; ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.3, 0, 7); ctx.fill(); }
    }
  }

  function draw3d(w, h) {
    if (!holo) holo = H.create(cv);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    holo.resize(w, h, dpr);
    holo.setYaw(H.yawFacing(game, 1));
    holo.render({ game: game, now: 0, dt: 0, mySeat: 1 });
  }

  // Legibility in screen pixels for whatever is on screen now.
  function stats(w, h) {
    const nodes = game.nodes, L = game.lanes;
    let proj;
    if (st.view === "3d") {
      const cam = holo.camera();
      proj = (n) => { const p = H.project(cam, n.x, n.y, 0); return { x: p.x, y: p.y }; };
    } else {
      const pad = 30, s = Math.min((w - pad * 2) / game.mapW, (h - pad * 2) / game.mapH);
      proj = (n) => ({ x: n.x * s, y: n.y * s });
    }
    const S = nodes.map(proj);
    let nn = 1e9, ll = 1e9, nl = 1e9;
    for (let i = 0; i < S.length; i++) for (let j = i + 1; j < S.length; j++) nn = Math.min(nn, Math.hypot(S[i].x - S[j].x, S[i].y - S[j].y));
    for (const l of L) {
      const a = S[l.a], b = S[l.b];
      ll = Math.min(ll, Math.hypot(a.x - b.x, a.y - b.y));
      const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
      for (let m = 0; m < S.length; m++) {
        if (m === l.a || m === l.b) continue;
        const t = Math.max(0, Math.min(1, ((S[m].x - a.x) * dx + (S[m].y - a.y) * dy) / l2));
        nl = Math.min(nl, Math.hypot(a.x + t * dx - S[m].x, a.y + t * dy - S[m].y));
      }
    }
    return { nn, ll, nl };
  }

  function render() {
    build();
    const [w, h] = fit();
    if (st.view === "3d" && H) draw3d(w, h); else draw2d(w, h);
    // The 3D scale shown is in this canvas's pixels, which are smaller than a real device's.
    const q = stats(w, h), [sw, sh] = SCREENS[st.shape], k = sw / w;
    const px = (v) => Math.round(v * k);
    document.getElementById("seedN").textContent = st.seed;
    document.getElementById("info").innerHTML =
      "<span><b>" + game.lanes.length + "</b> lanes</span>" +
      "<span>tightest nodes <b>" + px(q.nn) + "</b> px</span>" +
      "<span>shortest lane <b>" + px(q.ll) + "</b> px</span>" +
      "<span>lane nearest a station <b>" + px(q.nl) + "</b> px</span>" +
      "<span>(on a " + sw + "x" + sh + " screen)</span>" +
      '<a href="index.html?layout=' + st.style + '" target="_blank" rel="noopener">play ' + st.style + '</a>';
    for (const [id, key] of [["styleSeg", "style"], ["viewSeg", "view"], ["shapeSeg", "shape"]]) {
      for (const b of document.querySelectorAll("#" + id + " button")) b.setAttribute("aria-pressed", String(b.dataset.v === st[key]));
    }
    saveHash();
  }

  for (const [id, key] of [["styleSeg", "style"], ["viewSeg", "view"], ["shapeSeg", "shape"]]) {
    document.getElementById(id).addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      st[key] = b.dataset.v; render();
    });
  }
  const go = (d) => { st.seed = Math.max(1, st.seed + d); render(); };
  document.getElementById("prev").onclick = () => go(-1);
  document.getElementById("next").onclick = () => go(1);
  document.getElementById("rand").onclick = () => { st.seed = 1 + Math.floor(Math.random() * 99999); render(); };
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1);
  });
  window.addEventListener("resize", render);
  render();
})();
</script>
</body>
</html>
